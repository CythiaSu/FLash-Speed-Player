<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Flash Speed Player</title>
<style>

*{margin:0;padding:0;box-sizing:border-box}

body{display:flex;flex-direction:column}

#player-top .tbb:hover{color:#ffd700;border-color:#ffd700}
#player-top .tbb.danger{color:#f66;border-color:#844}
#player-top .tbb.danger:hover{background:#422;border-color:#f44;color:#f44}
#player-top #gameName{font-size:12px;color:#aaa;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sg{display:none;align-items:center;gap:2px}
.sp{padding:2px 6px;font-size:11px;border:1px solid #555;border-radius:4px;background:transparent;color:#aaa;cursor:pointer}
.sp:hover{background:#333}
.sp.spd{color:#f88;border-color:#855}.sp.spd:hover{background:#422;color:#f66}
.sp.spu{color:#8cf;border-color:#58a}.sp.spu:hover{background:#234;color:#6bf}
.sp.a{background:#ffd700;color:#111;border-color:#ffd700;font-weight:700}
#sv{font-size:12px;font-weight:700;color:#ffd700;min-width:32px;text-align:center}
#game-indicator{display:none;align-items:center;gap:5px;background:#1a1a2e;padding:2px 8px;flex-shrink:0;border-bottom:1px solid #2a2a4e;font-size:12px}
#game-indicator.show{display:flex}
#gi-dot{width:8px;height:8px;border-radius:50%;background:#4a4;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#gi-name{color:#ffd700;font-weight:700}
#browser{flex:1;display:flex;flex-direction:column;min-height:0}
#path-bar{display:flex;align-items:center;gap:3px;background:#222;border:1px solid #333;border-radius:6px;padding:3px 8px;margin:5px 8px;overflow-x:auto;overflow-y:hidden;flex-shrink:0}
#path-bar .up-btn{background:#333;border:1px solid #555;border-radius:4px;color:#aaa;padding:1px 6px;font-size:12px;cursor:pointer;flex-shrink:0;margin-right:4px}
#path-bar .up-btn:hover{color:#ffd700;border-color:#ffd700}
#path-bar .seg{color:#888;font-size:13px;cursor:pointer;padding:1px 4px;border-radius:3px;white-space:nowrap}
#path-bar .seg:hover{color:#ffd700;background:#2a2a2e}
#path-bar .sep{color:#555;font-size:12px;flex-shrink:0}
#path-bar .view-label{color:#ffd700;font-size:13px;padding:1px 4px;white-space:nowrap}
#list-wrap{flex:1;overflow-y:auto;min-height:0}
.item{display:flex;align-items:center;padding:7px 14px;cursor:pointer;border-bottom:1px solid #1a1a2a;gap:10px}
.item:hover{background:#1e1e30}
.item.focused{background:#2a2a45;border-left:3px solid #ffd700;padding-left:11px}
.item .ico{width:24px;height:20px;text-align:center;flex-shrink:0;color:#999;font-size:10px;line-height:18px;border:1px solid #555;border-radius:3px;font-weight:700}
.item.dir .ico{color:#6af;border-color:#357;background:#182438}
.item.swf .ico{color:#ffd700;border-color:#806f18;background:#302a12}
.item .nm{flex:1;font-size:13px;color:#ddd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.dir .nm{color:#6af}
.item .sz{font-size:11px;color:#555;flex-shrink:0}
.item .fav{color:#ffd700;font-size:15px;line-height:1;flex-shrink:0}
#empty{display:none;padding:30px;text-align:center;color:#555;flex:1}
#empty.show{display:block}
.btn{appearance:none;background:#2b2b3f;border:1px solid #555a75;border-radius:8px;color:#d8d8e6;padding:8px 18px;font-size:14px;line-height:1.2;cursor:pointer;font-family:inherit;box-shadow:none}
.btn:hover{color:#ffd700;border-color:#ffd700;background:#252540}
.btn:focus{outline:none;border-color:#ffd700;box-shadow:0 0 0 2px rgba(255,215,0,.18)}

#panel .btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
#about-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:900;align-items:center;justify-content:center}

#hk-panel .btn-row{display:flex;gap:10px;justify-content:center;margin-top:18px}
